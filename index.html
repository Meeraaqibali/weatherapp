<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SkyCast Weather</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2027">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { direction: ltr !important; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; scrollbar-width: none; -ms-overflow-style: none; direction: ltr; }
  *::-webkit-scrollbar { display: none; }

  :root {
    --text: #ffffff;
    --card: rgba(255,255,255,0.13);
    --border: rgba(255,255,255,0.22);
    --bg: linear-gradient(135deg, #1e3c4f, #2c5364, #3a6b8a);
  }
  body.light { --text:#1a1a1a; --card:rgba(0,0,0,0.05); --border:rgba(0,0,0,0.1); --bg: linear-gradient(135deg,#e0eafc,#cfdef3); }
  body.dark  { --text:#ffffff; --card:rgba(20,20,20,0.6); --border:rgba(255,255,255,0.1); --bg: linear-gradient(135deg,#0f0f0f,#1a1a1a); }

  body { font-family:'Inter',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center;
    background: var(--bg); color: var(--text); padding:16px; gap:10px; max-width:100vw; overflow-x:hidden;
    transition: background 0.5s ease, color 0.5s ease; }
  .app { width:100%; max-width:420px; display:flex; flex-direction:column; gap:10px; }

  .top-bar { display:flex; gap:8px; align-items:center; width:100%; }
  .search-bar { flex:1; min-width:0; display:flex; gap:8px; background:var(--card); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--border); border-radius:20px; padding:6px; }
  .search-bar input { flex:1; min-width:0; background:transparent; border:none; outline:none; color:var(--text); font-size:16px; padding:10px 14px; font-family:inherit; }
  .search-bar input::placeholder { color:var(--text); opacity:0.5; }
  .search-bar button { background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:14px; padding:0 18px; font-size:15px; font-weight:500; font-family:inherit; cursor:pointer; flex-shrink:0; }
  .search-bar button:active { transform:scale(0.95); }
  .settings-btn { background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:20px; width:50px; height:50px; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .settings-btn:active { transform:scale(0.9); }

  .card { background:var(--card); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--border); border-radius:28px; padding:20px; box-shadow:0 10px 30px rgba(0,0,0,0.1); }

  .location { font-size:13px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; opacity:0.85; margin-bottom:4px; }
  .date { font-size:12px; opacity:0.5; margin-bottom:14px; }
  .main-info { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .left-side { flex:1; min-width:0; }
  .right-side { flex-shrink:0; margin-left:16px; }
  .temp { font-size:80px; font-weight:200; line-height:1; letter-spacing:-0.04em; margin:4px 0; }
  .temp sup { font-size:28px; font-weight:300; vertical-align:super; }
  .condition { font-size:16px; opacity:0.9; }

  .icon { font-size:72px; margin:0; display:block; line-height:1; transform-origin:center center; }
  @keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  @keyframes jiggle { 0%,100%{transform:translateX(0) rotate(0)} 25%{transform:translateX(-4px) rotate(-6deg)} 50%{transform:translateX(0) rotate(0)} 75%{transform:translateX(4px) rotate(6deg)} }
  @keyframes rain { 0%,100%{transform:translateY(-5px)} 50%{transform:translateY(5px)} }
  @keyframes storm { 0%,40%,60%,100%{transform:scale(1);filter:brightness(1)} 45%,55%{transform:scale(1.08);filter:brightness(1.6)} 50%{transform:scale(1.15);filter:brightness(2.4)} }
  .icon.w-sunny { animation: spin 20s linear infinite; }
  .icon.w-cloud { animation: jiggle 4s ease-in-out infinite; }
  .icon.w-rain  { animation: rain 2s ease-in-out infinite; }
  .icon.w-storm { animation: storm 3s ease-in-out infinite; }

  .details { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; border-top:1px solid var(--border); padding-top:16px; }
  .detail-item { display:flex; flex-direction:column; align-items:center; text-align:center; min-width:0; }
  .detail-label { font-size:10px; text-transform:uppercase; letter-spacing:0.08em; opacity:0.6; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  .detail-value { font-size:15px; font-weight:500; white-space:nowrap; }

  .section-title { font-size:13px; text-transform:uppercase; letter-spacing:0.1em; opacity:0.7; margin-bottom:12px; font-weight:500; text-align:left; }

  .hourly-scroll { display:flex; gap:16px; overflow-x:auto; padding-bottom:8px; -webkit-overflow-scrolling:touch; }
  .hourly-item { display:flex; flex-direction:column; align-items:center; gap:6px; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:12px 16px; min-width:70px; flex-shrink:0; }
  .hourly-time { font-size:12px; opacity:0.7; }
  .hourly-icon { font-size:24px; }
  .hourly-temp { font-size:15px; font-weight:500; }

  .daily-list { display:flex; flex-direction:column; gap:8px; }
  .daily-item { display:flex; align-items:center; justify-content:space-between; background:var(--card); border:1px solid var(--border); border-radius:16px; padding:12px 16px; }
  .daily-day { font-size:14px; font-weight:500; text-align:left; }
  .daily-icon { font-size:20px; }
  .daily-temps { font-size:14px; opacity:0.8; }
  .daily-temps span { font-weight:600; opacity:1; }
  .more-btn { width:100%; padding:12px; background:var(--card); border:1px solid var(--border); border-radius:16px; color:var(--text); font-family:inherit; font-size:14px; font-weight:500; margin-top:8px; cursor:pointer; }
  .more-btn:active { transform:scale(0.97); }

  .extra-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .extra-item { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; cursor:pointer; position:relative; transition:transform 0.2s, opacity 0.3s; }
  .extra-item:active { transform:scale(0.95); }
  .extra-label { font-size:11px; text-transform:uppercase; letter-spacing:0.06em; opacity:0.6; margin-bottom:6px; padding-right:22px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .extra-value { font-size:18px; font-weight:500; margin-bottom:4px; }
  .extra-desc { font-size:11px; opacity:0.7; line-height:1.4; }
  .extra-arrow { position:absolute; top:16px; right:16px; opacity:0.4; font-size:14px; }

  .advice-item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px; background:var(--card); border:1px solid var(--border); border-radius:16px; margin-bottom:8px; cursor:pointer; transition:transform 0.2s, opacity 0.3s; }
  .advice-item:active { transform:scale(0.97); }
  .advice-left { display:flex; align-items:center; gap:12px; flex:1; min-width:0; }
  .advice-icon { font-size:20px; flex-shrink:0; }
  .advice-text { font-size:13px; line-height:1.4; opacity:0.9; text-align:left; }
  .advice-arrow { opacity:0.4; font-size:14px; flex-shrink:0; }

  .full-screen-detail {
    position:fixed; top:0; left:0; width:100vw; height:100vh;
    background:var(--bg); z-index:9999;
    padding:20px 20px 60px 20px; overflow-y:auto;
    color:var(--text); opacity:0; pointer-events:none;
    transition:opacity 0.6s ease;
    -webkit-overflow-scrolling:touch; touch-action:pan-y;
  }
  .full-screen-detail.active { opacity:1; pointer-events:auto; }
  .full-screen-detail.active .detail-header { animation:fadeUp 0.5s ease 0.1s both; }
  .full-screen-detail.active .detail-main-value { animation:fadeUp 0.5s ease 0.2s both; }
  .full-screen-detail.active .detail-main-label { animation:fadeUp 0.5s ease 0.25s both; }
  .full-screen-detail.active .detail-section:nth-of-type(1) { animation:fadeUp 0.5s ease 0.3s both; }
  .full-screen-detail.active .detail-section:nth-of-type(2) { animation:fadeUp 0.5s ease 0.4s both; }
  .full-screen-detail.active .other-details-list { animation:fadeUp 0.5s ease 0.5s both; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(15px)} to{opacity:1;transform:translateY(0)} }

  .detail-header { display:flex; align-items:center; gap:14px; margin-bottom:24px; width:100%; }
  .back-btn {
    background: linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.08));
    border: 1px solid rgba(255,255,255,0.25);
    color: var(--text);
    width:46px; height:46px; min-width:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; line-height:1; padding-bottom:2px;
    cursor:pointer; font-family:inherit; flex-shrink:0;
    backdrop-filter:blur(15px); -webkit-backdrop-filter:blur(15px);
    box-shadow: 0 4px 15px rgba(0,0,0,0.2), inset 0 1px 1px rgba(255,255,255,0.3);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    position:relative; overflow:hidden;
  }
  .back-btn::before {
    content:''; position:absolute; top:0; left:0; right:0; height:50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.15), transparent);
    border-radius: 50% 50% 0 0; pointer-events:none;
  }
  .back-btn:active { transform:scale(0.92); }

  .detail-title { font-size:21px; font-weight:600; flex:1; line-height:1.3; text-align:left; }

  .detail-main-value { font-size:60px; font-weight:200; margin-bottom:4px; letter-spacing:-0.04em; line-height:1; }
  .detail-main-label { font-size:14px; opacity:0.7; margin-bottom:28px; }
  .detail-section { margin-bottom:24px; }
  .detail-section h3 { font-size:16px; margin-bottom:10px; opacity:0.9; font-weight:600; text-align:left; }
  .detail-section p { font-size:14px; line-height:1.6; opacity:0.8; margin-bottom:10px; text-align:left; }
  .detail-section ul { padding-left:20px; margin-top:8px; }
  .detail-section li { font-size:14px; line-height:1.6; opacity:0.8; margin-bottom:6px; }

  .other-details-list { margin-top:10px; border-top:1px solid var(--border); padding-top:20px; width:100%; }
  .list-subtitle { font-size:13px; text-transform:uppercase; letter-spacing:0.08em; opacity:0.6; margin-top:16px; margin-bottom:12px; font-weight:600; text-align:left; }
  .other-detail-item { display:flex; justify-content:space-between; align-items:center; padding:16px; background:var(--card); border:1px solid var(--border); border-radius:16px; margin-bottom:10px; cursor:pointer; }
  .other-detail-item:active { transform:scale(0.97); }
  .other-detail-item span:first-child { font-size:14px; font-weight:500; text-align:left; }
  .other-detail-item span:last-child { font-size:16px; opacity:0.5; }

  .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); backdrop-filter:blur(5px); z-index:100; align-items:center; justify-content:center; padding:16px; opacity:0; transition:opacity 0.4s ease; }
  .modal.active { display:flex; opacity:1; }
  .modal-content { background:var(--bg); border:1px solid var(--border); border-radius:28px; padding:24px; width:min(400px,100%); max-height:80vh; overflow-y:auto; transform:translateY(20px); transition:transform 0.4s ease; }
  .modal.active .modal-content { transform:translateY(0); }
  .modal-content h2 { font-size:20px; font-weight:600; margin-bottom:16px; text-align:center; }
  .setting-item { margin-bottom:20px; }
  .setting-item label { display:block; font-size:13px; font-weight:500; opacity:0.8; margin-bottom:8px; text-align:left; }
  .setting-item select { width:100%; padding:12px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); font-family:inherit; font-size:15px; outline:none; appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'/%3e%3c/svg%3e"); background-repeat:no-repeat; background-position:right 12px center; background-size:16px; padding-right:40px; }
  .close-btn { width:100%; padding:14px; border-radius:16px; border:none; background:var(--text); color:#1a1a1a; font-family:inherit; font-size:16px; font-weight:600; cursor:pointer; margin-top:10px; }
  .error { color:#ff8a8a; font-size:14px; text-align:center; margin-top:10px; }
</style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <div class="search-bar">
        <input type="text" id="cityInput" data-i18n-ph="search" placeholder="Search city..." autocomplete="off">
        <button id="searchBtn" data-i18n="go">Go</button>
      </div>
      <button class="settings-btn" id="settingsBtn">⚙️</button>
    </div>

    <div class="card">
      <div class="location" id="location">Loading...</div>
      <div class="date" id="currentDate">--</div>
      <div class="main-info">
        <div class="left-side">
          <div class="temp"><span id="temp">--</span><sup>°</sup></div>
          <div class="condition" id="condition">Loading...</div>
        </div>
        <div class="right-side"><div class="icon" id="icon">☀️</div></div>
      </div>
      <div class="details">
        <div class="detail-item"><div class="detail-label" data-i18n="wind">Wind</div><div class="detail-value" id="wind">--</div></div>
        <div class="detail-item"><div class="detail-label" data-i18n="humidity">Humidity</div><div class="detail-value" id="humidity">--%</div></div>
        <div class="detail-item"><div class="detail-label" data-i18n="feels">Feels Like</div><div class="detail-value" id="feels">--</div></div>
      </div>
      <div class="error" id="error"></div>
    </div>

    <div class="card">
      <div class="section-title" data-i18n="hourly">Hourly Forecast</div>
      <div class="hourly-scroll" id="hourlyScroll"></div>
    </div>

    <div class="card">
      <div class="section-title" data-i18n="daily">7-Day Forecast</div>
      <div class="daily-list" id="dailyList"></div>
      <button class="more-btn" id="dailyMoreBtn" data-i18n="more">More</button>
    </div>

    <div class="card">
      <div class="section-title" data-i18n="details">More Details</div>
      <div class="extra-grid" id="extraGrid"></div>
    </div>

    <div class="card">
      <div class="section-title" data-i18n="life">🌿 Life Index</div>
      <div id="lifeIndex"></div>
    </div>
  </div>

  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h2 data-i18n="settings">App Settings</h2>
      <div class="setting-item"><label data-i18n="theme">Theme</label>
        <select id="themeSelect">
          <option value="auto" data-i18n="theme_auto">Auto</option>
          <option value="dark" data-i18n="theme_dark">Dark Mode</option>
          <option value="light" data-i18n="theme_light">Light Mode</option>
        </select>
      </div>
      <div class="setting-item"><label data-i18n="temp_unit">Temperature</label>
        <select id="unitSelect"><option value="C">Celsius</option><option value="F">Fahrenheit</option></select>
      </div>
      <div class="setting-item"><label data-i18n="wind_unit">Wind Speed</label>
        <select id="windUnitSelect"><option value="kmh">km/h</option><option value="mph">mph</option></select>
      </div>
      <div class="setting-item"><label data-i18n="time_format">Time Format</label>
        <select id="timeFormatSelect"><option value="12h">12-hour</option><option value="24h">24-hour</option></select>
      </div>
      <div class="setting-item"><label data-i18n="language">Language</label>
        <select id="langSelect">
          <option value="en">English</option>
          <option value="ur">Urdu</option>
          <option value="sd">Sindhi</option>
          <option value="es">Español</option>
        </select>
      </div>
      <button class="close-btn" id="closeSettingsBtn" data-i18n="done">Done</button>
    </div>
  </div>

  <div class="full-screen-detail" id="fullScreenDetail">
    <div class="detail-header">
      <button class="back-btn" id="backBtn">←</button>
      <div class="detail-title" id="fsTitle">Details</div>
    </div>
    <div class="detail-main-value" id="fsValue">--</div>
    <div class="detail-main-label" id="fsLabel">--</div>
    <div class="detail-section"><h3 data-i18n="about">About this metric</h3><div id="fsDesc"></div></div>
    <div class="detail-section"><h3 data-i18n="context">Current Context</h3><p id="fsContext"></p></div>
    <div class="other-details-list"><h3 data-i18n="explore">Explore Other Details</h3><div id="fsOtherList"></div></div>
  </div>

<script>

const dir = ['N','NE','E','SE','S','SW','W','NW'];
const el = id => document.getElementById(id);
let data = null, city = 'Digri', allDays = false;
let st = { unit:'C', windUnit:'kmh', theme:'auto', timeFormat:'12h', lang:'en' };

function tr(k) { return (T[st.lang] && T[st.lang][k]) || T.en[k] || k; }

function applyLang() {
  document.documentElement.setAttribute('dir','ltr');
  document.documentElement.setAttribute('lang', st.lang);
  document.body.style.direction = 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(e => {
    const k = e.getAttribute('data-i18n');
    if (e.tagName === 'INPUT' || e.tagName === 'SELECT') return;
    e.textContent = tr(k);
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(e => {
    e.placeholder = tr(e.getAttribute('data-i18n-ph'));
  });
  el('dailyMoreBtn').textContent = allDays ? tr('less') : tr('more');
}

function loadSet() {
  const s = localStorage.getItem('weatherSettings');
  if (s) {
    st = Object.assign(st, JSON.parse(s));
    if (el('themeSelect')) el('themeSelect').value = st.theme;
    if (el('unitSelect')) el('unitSelect').value = st.unit;
    if (el('windUnitSelect')) el('windUnitSelect').value = st.windUnit;
    if (el('timeFormatSelect')) el('timeFormatSelect').value = st.timeFormat;
    if (el('langSelect')) el('langSelect').value = st.lang;
  }
  applyTheme(); applyLang();
}
function saveSet() {
  localStorage.setItem('weatherSettings', JSON.stringify(st));
  applyTheme(); applyLang();
  if (data) render();
}
function applyTheme() {
  document.body.className = '';
  if (st.theme === 'light') document.body.classList.add('light');
  else if (st.theme === 'dark') document.body.classList.add('dark');
  if (st.theme === 'auto' && data && data.gradient) document.body.style.background = data.gradient;
  else document.body.style.background = '';
}

function fmtTemp(c) { return st.unit === 'C' ? Math.round(c) + '°' : Math.round(c * 9 / 5 + 32) + '°'; }
function fmtWind(k) { return st.windUnit === 'kmh' ? Math.round(k) + ' km/h' : Math.round(k * 0.621371) + ' mph'; }
function fmtTime(iso) { const d = new Date(iso); return st.timeFormat === '24h' ? d.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit'}) : d.toLocaleTimeString('en-US', {hour:'2-digit',minute:'2-digit'}); }
function fmtHour(iso) { return new Date(iso).getHours().toString().padStart(2,'0') + ':00'; }
function fmtDay(iso) { return tr('d' + new Date(iso).getDay()); }
function fmtDate(d) {
  const day = tr('d' + d.getDay());
  const mon = tr('m' + d.getMonth());
  return day + ', ' + d.getDate() + ' ' + mon + ' ' + d.getFullYear();
}

function iconClass(code) {
  if (code === 0 || code === 1) return 'w-sunny';
  if (code === 2 || code === 3 || code === 45 || code === 48) return 'w-cloud';
  if (code >= 51 && code <= 75) return 'w-rain';
  if (code === 95 || code === 96 || code === 99) return 'w-storm';
  return 'w-sunny';
}

async function geocode(q) {
  const cmap = {pakistan:'PK',india:'IN',bangladesh:'BD',usa:'US',uk:'GB',england:'GB',china:'CN',uae:'AE',dubai:'AE','saudi arabia':'SA',iran:'IR',afghanistan:'AF',turkey:'TR',canada:'CA',australia:'AU',germany:'DE',france:'FR',japan:'JP',malaysia:'MY'};
  const lq = q.toLowerCase().trim();
  let hint = null, name = q.trim();
  for (let k in cmap) { if (lq.endsWith(' ' + k)) { hint = cmap[k]; name = name.slice(0, -(k.length + 1)).trim(); break; } }
  const admin = ['sindh','punjab','balochistan','kpk','kashmir','ajk','islamabad'];
  for (let a of admin) { if (lq.includes(a)) { name = name.replace(new RegExp(a,'i'),'').trim(); if (!hint) hint = 'PK'; break; } }
  if (!name) name = q;
  const vars = [name, name.replace(/ /g,''), name.split(' ')[0], name.substring(0, Math.max(4, name.length - 1))];
  const uniq = [...new Set(vars)].filter(v => v.length >= 3);
  let all = [];
  for (let v of uniq) {
    try {
      const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(v) + '&count=10&language=en&format=json');
      const d = await r.json();
      if (d.results) all = all.concat(d.results);
    } catch (e) {}
  }
  if (!all.length) throw new Error('City not found. Try a different spelling.');
  const seen = new Set();
  all = all.filter(r => { if (seen.has(r.id)) return false; seen.add(r.id); return true; });
  if (hint) { const m = all.filter(r => r.country_code === hint); if (m.length) all = m; }
  else { const pk = all.filter(r => r.country_code === 'PK'); if (pk.length) all = pk; }
  all.sort((a, b) => (b.population || 0) - (a.population || 0));
  return all[0];
}

async function fetchW(lat, lon, name) {
  const wu = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m,precipitation&hourly=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_probability_max&timezone=auto';
  const au = 'https://air-quality-api.open-meteo.com/v1/air-quality?latitude=' + lat + '&longitude=' + lon + '&current=european_aqi&timezone=auto';
  const [wr, ar] = await Promise.all([fetch(wu), fetch(au)]);
  const w = await wr.json();
  const a = await ar.json();
  const c = w.current;
  data = { w, a, c, name, gradient: (W[c.weather_code] || {}).g || 'linear-gradient(135deg,#1e3c4f,#2c5364,#3a6b8a)' };
  applyTheme(); render();
}

function render() {
  if (!data) return;
  const { w, a, c, name } = data;
  el('location').textContent = name;
  el('icon').textContent = (W[c.weather_code] || {}).i || '❓';
  el('icon').className = 'icon ' + iconClass(c.weather_code);
  el('temp').textContent = fmtTemp(c.temperature_2m);
  el('condition').textContent = tr('w' + c.weather_code) || 'Unknown';
  el('wind').textContent = fmtWind(c.wind_speed_10m);
  el('humidity').textContent = c.relative_humidity_2m + '%';
  el('feels').textContent = fmtTemp(c.apparent_temperature);
  el('error').textContent = '';
  el('currentDate').textContent = fmtDate(new Date());

  const now = new Date();
  let hh = '', cnt = 0;
  for (let i = 0; i < w.hourly.time.length && cnt < 24; i++) {
    if (new Date(w.hourly.time[i]) >= now) {
      hh += '<div class="hourly-item"><div class="hourly-time">' + (cnt === 0 ? tr('now') : fmtHour(w.hourly.time[i])) + '</div><div class="hourly-icon">' + ((W[w.hourly.weather_code[i]] || {}).i || '❓') + '</div><div class="hourly-temp">' + fmtTemp(w.hourly.temperature_2m[i]) + '</div></div>';
      cnt++;
    }
  }
  el('hourlyScroll').innerHTML = hh;

  const days = allDays ? 7 : 3;
  let dh = '';
  for (let i = 0; i < days; i++) {
    dh += '<div class="daily-item"><div class="daily-day">' + (i === 0 ? tr('today') : fmtDay(w.daily.time[i])) + '</div><div class="daily-icon">' + ((W[w.daily.weather_code[i]] || {}).i || '❓') + '</div><div class="daily-temps"><span>' + fmtTemp(w.daily.temperature_2m_max[i]) + '</span> / ' + fmtTemp(w.daily.temperature_2m_min[i]) + '</div></div>';
  }
  el('dailyList').innerHTML = dh;
  el('dailyMoreBtn').textContent = allDays ? tr('less') : tr('more');

  const wd = dir[Math.round(c.wind_direction_10m / 45) % 8];
  const aqi = a.current.european_aqi;
  let at = 'Good'; if (aqi > 20) at = 'Fair'; if (aqi > 40) at = 'Moderate'; if (aqi > 60) at = 'Poor';
  const uv = w.daily.uv_index_max[0];
  let ut = 'Low'; if (uv > 2) ut = 'Moderate'; if (uv > 5) ut = 'High'; if (uv > 7) ut = 'Very High';

  el('extraGrid').innerHTML =
    '<div class="extra-item" onclick="showDetail(\'precip\',this)"><div class="extra-arrow">›</div><div class="extra-label">🌧️ ' + tr('precip') + '</div><div class="extra-value">' + c.precipitation + ' mm</div><div class="extra-desc">' + w.daily.precipitation_probability_max[0] + '% ' + tr('chance') + '</div></div>' +
    '<div class="extra-item" onclick="showDetail(\'wind\',this)"><div class="extra-arrow">›</div><div class="extra-label">💨 ' + tr('wind') + '</div><div class="extra-value">' + fmtWind(c.wind_speed_10m) + ' ' + wd + '</div><div class="extra-desc">' + (c.wind_speed_10m > 20 ? tr('strong_winds') : tr('light_breeze')) + '</div></div>' +
    '<div class="extra-item" onclick="showDetail(\'aqi\',this)"><div class="extra-arrow">›</div><div class="extra-label">🌍 ' + tr('aqi') + '</div><div class="extra-value">' + aqi + ' | ' + at + '</div></div>' +
    '<div class="extra-item" onclick="showDetail(\'uv\',this)"><div class="extra-arrow">›</div><div class="extra-label">☀️ ' + tr('uv') + '</div><div class="extra-value">' + uv + ' | ' + ut + '</div></div>' +
    '<div class="extra-item" onclick="showDetail(\'humidity\',this)"><div class="extra-arrow">›</div><div class="extra-label">💧 ' + tr('humidity') + '</div><div class="extra-value">' + c.relative_humidity_2m + '%</div></div>' +
    '<div class="extra-item" onclick="showDetail(\'sun\',this)"><div class="extra-arrow">›</div><div class="extra-label">🌅 ' + tr('sun') + '</div><div class="extra-value">' + fmtTime(w.daily.sunrise[0]) + '</div></div>';

  const temp = c.temperature_2m, wcode = c.weather_code;
  let lh = '';
  lh += '<div class="advice-item" onclick="showDetail(\'life_outdoor\',this)"><div class="advice-left"><div class="advice-icon">🏃</div><div class="advice-text">' + (wcode >= 51 || temp > 38 || temp < 5 ? tr('outdoor_bad') : tr('outdoor_great')) + '</div></div><div class="advice-arrow">›</div></div>';
  lh += '<div class="advice-item" onclick="showDetail(\'life_clothing\',this)"><div class="advice-left"><div class="advice-icon">👕</div><div class="advice-text">' + (temp > 30 ? tr('clothing_light') : temp > 20 ? tr('clothing_ok') : tr('clothing_warm')) + '</div></div><div class="advice-arrow">›</div></div>';
  lh += '<div class="advice-item" onclick="showDetail(\'life_cold\',this)"><div class="advice-left"><div class="advice-icon">💊</div><div class="advice-text">' + (c.apparent_temperature < 15 || c.relative_humidity_2m > 80 ? tr('cold_high') : tr('cold_low')) + '</div></div><div class="advice-arrow">›</div></div>';
  lh += '<div class="advice-item" onclick="showDetail(\'life_drive\',this)"><div class="advice-left"><div class="advice-icon">🚗</div><div class="advice-text">' + ((wcode >= 45 && wcode <= 48) || wcode >= 61 ? tr('drive_caution') : tr('drive_good')) + '</div></div><div class="advice-arrow">›</div></div>';
  el('lifeIndex').innerHTML = lh;
}

function showDetail(type, card) {
  if (!data) return;
  if (card) {
    if (card.dataset.loading === '1') return;
    card.dataset.loading = '1';
    card.style.opacity = '0.5';
    card.style.transform = 'scale(0.95)';
  }
  if (window._t) clearTimeout(window._t);
  window._t = setTimeout(() => {
    if (card) { card.style.opacity = ''; card.style.transform = ''; card.dataset.loading = '0'; }
    openDetail(type);
  }, 700);
}

function openDetail(type) {
  if (!data) return;
  const { w, a, c } = data;
  let title = '', value = '', label = '', desc = '', ctx = '';

  if (type === 'precip') {
    title = '🌧️ ' + tr('precip');
    value = c.precipitation + ' mm';
    label = w.daily.precipitation_probability_max[0] + '% ' + tr('chance');
    desc = tr('desc_precip');
    ctx = c.precipitation > 0 ? tr('currently_raining') : tr('just_now');
  } else if (type === 'wind') {
    const wd = dir[Math.round(c.wind_direction_10m / 45) % 8];
    title = '💨 ' + tr('wind');
    value = fmtWind(c.wind_speed_10m);
    label = tr('direction') + ': ' + wd;
    desc = tr('desc_wind');
    ctx = c.wind_speed_10m > 20 ? tr('strong_winds') : tr('light_breeze_pleasant');
  } else if (type === 'aqi') {
    const aqi = a.current.european_aqi;
    let t = 'Good'; if (aqi > 20) t = 'Fair'; if (aqi > 40) t = 'Moderate'; if (aqi > 60) t = 'Poor';
    title = '🌍 ' + tr('aqi');
    value = '' + aqi;
    label = tr('category') + ': ' + t;
    desc = tr('desc_aqi');
    ctx = 'AQI: ' + aqi + ' (' + t + ')';
  } else if (type === 'uv') {
    const uv = w.daily.uv_index_max[0];
    let t = 'Low'; if (uv > 2) t = 'Moderate'; if (uv > 5) t = 'High'; if (uv > 7) t = 'Very High';
    title = '☀️ ' + tr('uv');
    value = '' + uv;
    label = tr('category') + ': ' + t;
    desc = tr('desc_uv');
    ctx = 'UV: ' + t;
  } else if (type === 'humidity') {
    title = '💧 ' + tr('humidity');
    value = c.relative_humidity_2m + '%';
    label = c.relative_humidity_2m > 60 ? tr('muggy') : tr('comfortable');
    desc = tr('desc_humidity');
    ctx = c.relative_humidity_2m + '%';
  } else if (type === 'sun') {
    title = '🌅 ' + tr('sun');
    value = fmtTime(w.daily.sunrise[0]) + ' / ' + fmtTime(w.daily.sunset[0]);
    label = tr('sunrise') + ' / ' + tr('sunset');
    desc = tr('desc_sun');
    ctx = fmtTime(w.daily.sunrise[0]) + ' / ' + fmtTime(w.daily.sunset[0]);
  } else if (type === 'life_outdoor') {
    const t = c.temperature_2m, wc = c.weather_code;
    title = '🏃 ' + tr('outdoor_activity');
    value = (wc >= 51 || t > 38 || t < 5) ? tr('not_recommended') : tr('great_day');
    label = tr('based_on');
    desc = tr('desc_outdoor');
    ctx = (wc >= 51 || t > 38 || t < 5) ? tr('outdoor_bad') : tr('outdoor_great');
  } else if (type === 'life_clothing') {
    const t = c.temperature_2m;
    title = '👕 ' + tr('clothing_advice');
    value = t > 30 ? tr('light_clothing') : t > 20 ? tr('comfortable') : tr('warm_layers');
    label = tr('what_to_wear');
    desc = tr('desc_clothing');
    ctx = t > 30 ? tr('clothing_light') : t > 20 ? tr('clothing_ok') : tr('clothing_warm');
  } else if (type === 'life_cold') {
    title = '💊 ' + tr('cold_flu');
    value = (c.apparent_temperature < 15 || c.relative_humidity_2m > 80) ? tr('higher_risk') : tr('low_risk');
    label = tr('health_advice');
    desc = tr('desc_cold');
    ctx = (c.apparent_temperature < 15 || c.relative_humidity_2m > 80) ? tr('cold_high') : tr('cold_low');
  } else if (type === 'life_drive') {
    const wc = c.weather_code;
    title = '🚗 ' + tr('driving');
    value = ((wc >= 45 && wc <= 48) || wc >= 61) ? tr('caution') : tr('excellent');
    label = tr('road_safety');
    desc = tr('desc_drive');
    ctx = ((wc >= 45 && wc <= 48) || wc >= 61) ? tr('drive_caution') : tr('drive_good');
  }

  el('fsTitle').textContent = title;
  el('fsValue').textContent = value;
  el('fsLabel').textContent = label;
  el('fsDesc').innerHTML = '<p>' + desc + '</p>';
  el('fsContext').textContent = ctx;

  const m = [{k:'precip',n:'🌧️ ' + tr('precip')},{k:'wind',n:'💨 ' + tr('wind')},{k:'aqi',n:'🌍 ' + tr('aqi')},{k:'uv',n:'☀️ ' + tr('uv')},{k:'humidity',n:'💧 ' + tr('humidity')},{k:'sun',n:'🌅 ' + tr('sun')}];
  const l = [{k:'life_outdoor',n:'🏃 ' + tr('outdoor_activity')},{k:'life_clothing',n:'👕 ' + tr('clothing_advice')},{k:'life_cold',n:'💊 ' + tr('cold_flu')},{k:'life_drive',n:'🚗 ' + tr('driving')}];
  let html = '';
  let wh = ''; m.forEach(x => { if (x.k !== type) wh += '<div class="other-detail-item" onclick="showDetail(\'' + x.k + '\',this)"><span>' + x.n + '</span><span>›</span></div>'; });
  if (wh) html += '<div class="list-subtitle">' + tr('weather_metrics') + '</div>' + wh;
  let lh = ''; l.forEach(x => { if (x.k !== type) lh += '<div class="other-detail-item" onclick="showDetail(\'' + x.k + '\',this)"><span>' + x.n + '</span><span>›</span></div>'; });
  if (lh) html += '<div class="list-subtitle" style="margin-top:24px">' + tr('lifestyle_index') + '</div>' + lh;
  el('fsOtherList').innerHTML = html;

  el('fullScreenDetail').classList.add('active');
}

function closeDetail() {
  const b = el('backBtn');
  if (b.dataset.c === '1') return;
  b.dataset.c = '1';
  b.style.opacity = '0.4';
  setTimeout(() => {
    el('fullScreenDetail').classList.remove('active');
    b.dataset.c = '0';
    b.style.opacity = '';
  }, 700);
}

async function loadCity(c) {
  try {
    el('error').textContent = '';
    el('condition').textContent = '...';
    const loc = await geocode(c);
    await fetchW(loc.latitude, loc.longitude, loc.name + ', ' + loc.country);
  } catch (e) {
    el('error').textContent = e.message;
    el('condition').textContent = '—';
  }
}

el('searchBtn').onclick = () => { const v = el('cityInput').value.trim(); if (v) loadCity(v); };
el('cityInput').onkeydown = (e) => { if (e.key === 'Enter') { const v = el('cityInput').value.trim(); if (v) loadCity(v); } };
el('dailyMoreBtn').onclick = () => { allDays = !allDays; render(); };
el('settingsBtn').onclick = () => el('settingsModal').classList.add('active');
el('closeSettingsBtn').onclick = () => el('settingsModal').classList.remove('active');
el('backBtn').onclick = closeDetail;
el('themeSelect').onchange = (e) => { st.theme = e.target.value; saveSet(); };
el('unitSelect').onchange = (e) => { st.unit = e.target.value; saveSet(); };
el('windUnitSelect').onchange = (e) => { st.windUnit = e.target.value; saveSet(); };
el('timeFormatSelect').onchange = (e) => { st.timeFormat = e.target.value; saveSet(); };
el('langSelect').onchange = (e) => { st.lang = e.target.value; saveSet(); };

let bp = false;
history.pushState(null, null, location.href);
window.addEventListener('popstate', function () {
  if (el('fullScreenDetail').classList.contains('active')) { closeDetail(); history.pushState(null, null, location.href); return; }
  if (el('settingsModal').classList.contains('active')) { el('settingsModal').classList.remove('active'); history.pushState(null, null, location.href); return; }
  if (bp) { window.history.back(); return; }
  bp = true;
  const t = document.createElement('div');
  t.textContent = 'Press back again to exit';
  t.style.cssText = 'position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:white;padding:10px 20px;border-radius:20px;font-size:14px;z-index:99999;font-family:Inter,sans-serif;';
  document.body.appendChild(t);
  setTimeout(() => { bp = false; if (t.parentNode) t.parentNode.removeChild(t); }, 2000);
  history.pushState(null, null, location.href);
});

if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); }); }

loadSet();
loadCity('Digri');
</script>
</body>
</html>
