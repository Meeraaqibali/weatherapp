name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Prepare Android Project
        run: |
          mkdir -p app/src/main/java/com/meeraaqibali/weatherapp
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > app/src/main/AndroidManifest.xml << 'M'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.meeraaqibali.weatherapp">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="SkyCast Weather"
                  android:icon="@drawable/app_icon"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          M

          cat > app/src/main/res/values/styles.xml << 'S'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
              <item name="android:windowBackground">#1e3c4f</item>
              <item name="android:statusBarColor">#1e3c4f</item>
              <item name="android:navigationBarColor">#1e3c4f</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowDrawsSystemBarBackgrounds">true</item>
            </style>
          </resources>
          S

          cat > app/src/main/res/drawable/app_icon.xml << 'I'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#1e3c4f"
                  android:pathData="M0,0 h108 v108 h-108 z"/>
              <path
                  android:fillColor="#FFD93D"
                  android:pathData="M54,48 m-18,0 a18,18 0 1,0 36,0 a18,18 0 1,0 -36,0"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M38,72 Q38,60 50,60 Q54,54 62,56 Q70,56 72,66 Q80,66 80,74 Q80,80 74,80 L44,80 Q38,80 38,72 Z"/>
          </vector>
          I

          cat > app/src/main/java/com/meeraaqibali/weatherapp/MainActivity.java << 'J'
          package com.meeraaqibali.weatherapp;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.widget.Toast;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private boolean doubleBackToExitPressedOnce = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.parseColor("#1e3c4f"));
                  getWindow().setNavigationBarColor(Color.parseColor("#1e3c4f"));

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.loadUrl("https://meeraaqibali.github.io/weatherapp/");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                      return;
                  }
                  if (doubleBackToExitPressedOnce) {
                      super.onBackPressed();
                      return;
                  }
                  this.doubleBackToExitPressedOnce = true;
                  Toast.makeText(this, "Press back again to exit", Toast.LENGTH_SHORT).show();
                  new Handler(Looper.getMainLooper()).postDelayed(new Runnable() {
                      @Override
                      public void run() {
                          doubleBackToExitPressedOnce = false;
                      }
                  }, 2000);
              }
          }
          J

          cat > app/build.gradle << 'G'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.meeraaqibali.weatherapp'
              compileSdk 34
              defaultConfig {
                  applicationId "com.meeraaqibali.weatherapp"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "2.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          G

          cat > build.gradle << 'G'
          plugins { id 'com.android.application' version '8.1.4' apply false }
          G

          cat > settings.gradle << 'G'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "WeatherApp"
          include ':app'
          G

          cat > gradle.properties << 'G'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          G

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.4

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weather-app-apk
          path: app/build/outputs/apk/debug/app-debug.apk
